name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Build R8 Release APK
        run: ./gradlew :app:assembleRelease --console=plain

      - name: Rename release APK
        run: |
          TAG="${GITHUB_REF_NAME:-release}"
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$SRC" "musica-${TAG}.apk"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: musica-*.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: musica-release-${{ github.ref_name }}
          path: musica-*.apk
