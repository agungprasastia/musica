name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Test, Lint & Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests and Android Lint
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug --console=plain

      - name: Assemble Debug & R8 Release APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --console=plain

      - name: Upload Lint report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results-debug
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: musica-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
