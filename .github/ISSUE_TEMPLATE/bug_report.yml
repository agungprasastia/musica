name: Bug Report
description: Report a bug or unexpected behavior in Musica
title: "[Bug]: "
labels: [ "bug" ]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the details below so we can reproduce and fix it quickly.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug clearly and concisely.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the exact steps to trigger the issue.
      placeholder: |
        1. Open Musica
        2. Go to ...
        3. Tap on ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?

  - type: input
    id: device
    attributes:
      label: Device & Android version
      placeholder: e.g. Pixel 8 / OPPO CPH2631, Android 15
    validations:
      required: true

  - type: input
    id: app_version
    attributes:
      label: Musica version
      placeholder: e.g. 1.0.0
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Screenshots or Logcat (optional)
      description: Paste relevant crash logs or attach screenshots below.
